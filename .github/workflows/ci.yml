name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vet-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run mod:check
      - run: mise run vet
      - run: mise run lint
      - run: mise run test
      - run: mise run test:race
